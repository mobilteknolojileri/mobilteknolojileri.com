name: IndexNow

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Cloudflare deploys the push on its own, give it time to go live first
      - name: Wait for the deploy
        run: sleep 150
      - name: Notify IndexNow
        run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
